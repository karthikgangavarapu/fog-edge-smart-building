name: CI/CD

# Pull requests are tested only; pushes to main are tested and then deployed.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-1
  STACK_NAME: fogedge

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check sensors fog backend tests --select E9,F63,F7,F82
      - name: Unit & integration tests
        run: pytest -q --junitxml=test-results.xml
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: test-results, path: test-results.xml }

  e2e:
    name: End-to-end pipeline smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Start backend
        run: |
          uvicorn backend.local.main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Run sensors + fog for 30s against the backend
        run: python run_demo.py --seconds 30 --ingest http://localhost:8000/api/ingest
      - name: Assert data landed in the backend
        run: python scripts/assert_pipeline.py http://localhost:8000/api/metrics
      - name: Measure fog data reduction
        run: python -m loadtest.benchmark reduction --seconds 20

  validate-infra:
    name: Validate CloudFormation template
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Lint the template
        run: |
          pip install cfn-lint
          cfn-lint infra/template.yaml

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [test, e2e, validate-infra]
    # Skipped, not failed, until the AWS deployment role is configured in
    # repository secrets. A pipeline that goes red because an optional secret
    # is absent trains you to ignore red pipelines.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.AWS_DEPLOY_ENABLED == 'true'
    environment: production
    # Required for OIDC: GitHub mints a short-lived token and assumes an AWS
    # role, so no long-lived access key is ever stored in the repository.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Package and upload the Lambda code
        id: package
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${STACK_NAME}-code-${ACCOUNT}-${AWS_REGION}"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          KEY="lambda-${GITHUB_SHA}.zip"
          (cd backend/aws && zip -qr /tmp/lambda.zip .)
          aws s3 cp /tmp/lambda.zip "s3://$BUCKET/$KEY"
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "key=$KEY"       >> $GITHUB_OUTPUT
      - name: Deploy the CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              CodeBucket=${{ steps.package.outputs.bucket }} \
              CodeKey=${{ steps.package.outputs.key }} \
              ApiKey=${{ secrets.FOG_API_KEY }}
      - name: Post-deploy smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION" \
                  --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue" \
                  --output text)
          curl -sf "$URL" > /dev/null && echo "cloud backend healthy at $URL"
